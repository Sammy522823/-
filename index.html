<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC 建筑方块认领系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🏗️ MC 建筑方块认领系统</h1>
        
        <!-- 添加按钮 -->
        <button id="addBlockBtn" class="add-btn">+ 添加新方块</button>

        <table id="blocksTable">
            <thead>
                <tr>
                    <th>方块名称</th>
                    <th>数量</th>
                    <th>认领人</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <!-- 示例数据 -->
                <tr>
                    <td>圆石</td>
                    <td>X:10, Y:64, Z:-5</td>
                    <td>未认领</td>
                    <td>
                        <button class="edit-btn">编辑</button>
                        <button class="delete-btn">删除</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
